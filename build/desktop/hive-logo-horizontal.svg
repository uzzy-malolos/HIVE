<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" fill="none" role="img" aria-label="HIVE - Hyper Intelligence for Verified Engineering">
  <defs>
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c26" />
      <stop offset="100%" stop-color="#08070d" />
    </linearGradient>
    <linearGradient id="h-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="h-wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ddd6fe" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="h-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="2" y="2" width="636" height="156" rx="24" fill="url(#h-bg)" stroke="url(#h-border)" stroke-width="2" />

  <!-- Left Hive Mark Lockup (80, 80) -->
  <g transform="translate(24, 20)">
    <!-- Squircle container -->
    <rect x="8" y="8" width="104" height="104" rx="24" fill="#180f30" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Connected Satellites -->
    <polygon points="42,34 52,40 52,52 42,58 32,52 32,40" fill="#140d28" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" />
    <polygon points="78,34 88,40 88,52 78,58 68,52 68,40" fill="#140d28" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" />
    <polygon points="60,74 70,80 70,92 60,98 50,92 50,80" fill="#140d28" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Central Queen Nucleus -->
    <g filter="url(#h-glow)">
      <polygon points="60,48 74,56 74,72 60,80 46,72 46,56" fill="#201340" stroke="url(#h-hex)" stroke-width="3" stroke-linejoin="round" />
      <polygon points="60,57 66,64 60,71 54,64" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography Lockup -->
  <!-- Primary Wordmark -->
  <text x="170" y="86" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="56" font-weight="900" letter-spacing="0.18em" fill="url(#h-wordmark)">HIVE</text>
  
  <!-- Version Tag Pill -->
  <rect x="360" y="48" width="64" height="24" rx="12" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1" />
  <text x="392" y="64" font-family="monospace" font-size="12" font-weight="700" fill="#ddd6fe" text-anchor="middle">v0.5.0</text>

  <!-- Tagline & Verified Mission -->
  <text x="172" y="116" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.08em" fill="#9ca3af">HYPER INTELLIGENCE FOR VERIFIED ENGINEERING</text>
</svg>
