<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="HIVE Verified Engineering">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150d2a" />
      <stop offset="50%" stop-color="#0b0716" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Hex Gradients -->
    <linearGradient id="hex-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="30%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="hex-accent-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="hex-accent-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="nucleus-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ddd6fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />
  
  <!-- Subtle Internal Grid Matrix -->
  <circle cx="256" cy="256" r="190" fill="url(#center-glow)" />

  <!-- Quantum Circuit Connecting Lines -->
  <g stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 6">
    <line x1="256" y1="256" x2="180" y2="150" />
    <line x1="256" y1="256" x2="332" y2="150" />
    <line x1="256" y1="256" x2="256" y2="370" />
    <line x1="180" y1="150" x2="332" y2="150" />
  </g>

  <!-- Circuit Micro-Terminals -->
  <circle cx="180" cy="150" r="4" fill="#ddd6fe" filter="url(#core-glow)" />
  <circle cx="332" cy="150" r="4" fill="#ddd6fe" filter="url(#core-glow)" />
  <circle cx="256" cy="370" r="4" fill="#ddd6fe" filter="url(#core-glow)" />

  <!-- Outer Isometric Swarm Nodes -->
  <!-- Top-Left Satellite Node -->
  <g filter="url(#hex-glow)">
    <polygon points="180,95 230,124 230,182 180,211 130,182 130,124" fill="#150e29" stroke="url(#hex-accent-1)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="180,118 210,135 210,171 180,188 150,171 150,135" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="180" cy="153" r="6" fill="#a78bfa" />
  </g>

  <!-- Top-Right Satellite Node -->
  <g filter="url(#hex-glow)">
    <polygon points="332,95 382,124 382,182 332,211 282,182 282,124" fill="#150e29" stroke="url(#hex-accent-2)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="332,118 362,135 362,171 332,188 302,171 302,135" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="332" cy="153" r="6" fill="#818cf8" />
  </g>

  <!-- Bottom Sentry Node -->
  <g filter="url(#hex-glow)">
    <polygon points="256,295 306,324 306,382 256,411 206,382 206,324" fill="#150e29" stroke="url(#hex-accent-1)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="256,318 286,335 286,371 256,388 226,371 226,335" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="256" cy="353" r="6" fill="#38bdf8" />
  </g>

  <!-- Central Queen Command Node (Core Nucleus) -->
  <g filter="url(#hex-glow)">
    <!-- Elevated Outer Bevel -->
    <polygon points="256,180 320,217 320,291 256,328 192,291 192,217" fill="#1a1133" stroke="url(#hex-primary)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Facet Shadow Shading for 3D Depth -->
    <polygon points="256,180 320,217 256,254 192,217" fill="#ffffff" fill-opacity="0.08" />
    <polygon points="320,217 320,291 256,254" fill="#000000" fill-opacity="0.25" />
    <polygon points="192,217 192,291 256,254" fill="#000000" fill-opacity="0.15" />
    <polygon points="192,291 256,328 256,254" fill="#000000" fill-opacity="0.35" />
    <polygon points="320,291 256,328 256,254" fill="#000000" fill-opacity="0.4" />

    <!-- Luminous Verified Queen Core -->
    <polygon points="256,214 290,234 290,274 256,294 222,274 222,234" fill="url(#hex-primary)" stroke="#ddd6fe" stroke-width="2.5" />
    
    <!-- Pulsing Center Energy Diamond -->
    <polygon points="256,236 272,254 256,272 240,254" fill="url(#nucleus-glow)" filter="url(#core-glow)" />
  </g>

  <!-- Ambient Specular Glint Top-Left Corner -->
  <path d="M56 80 Q100 48 160 40" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
